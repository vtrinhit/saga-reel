# For developers running `alembic` by hand from the repo root only.
# The app and the tests do NOT read this file: `Database.migrate()` builds its Config in code.
# Keep this file ASCII-only: on Windows Alembic reads it with the locale encoding (cp1252).
#
# Example (scratch DB, never the real data/ folder):
#   set SAGAREEL_DATA_DIR=D:\tmp\sagareel-dev
#   .venv\Scripts\alembic upgrade head
#   .venv\Scripts\alembic revision --autogenerate --rev-id 0002 -m change_name

[alembic]
script_location = %(here)s/backend/sagareel/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = backend
path_separator = os

# sqlalchemy.url is intentionally unset: env.py uses load_settings().db_path (honours SAGAREEL_DATA_DIR).
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
