# Số liệu thể loại tham khảo (chép vào project.genre khi tạo project): narration (thuyết minh trên ảnh tĩnh + Ken Burns). Số liệu: docs/research/film-craft/craft-and-prompts.md §7.4.
key: narration
name: Thuyết minh
data:
  label: Narration - kể chuyện thuyết minh
  description: Người kể dẫn dắt trên ảnh tĩnh chuyển động nhẹ (Ken Burns); hợp truyện cổ tích, lịch sử, tin tức.
  episode_s: [45, 180]
  clip_s: [3, 4]
  still_max_s: 5.0
  still_static_max_s: 2.5
  clips: [12, 40]
  transition: crossfade
  transition_s: 0.4
  ken_burns: {zoom: [1.00, 1.10], pan_max_pct: 6, vary_direction: true}
  end: loop_or_cta
  duck_db: 10
  hook: {window_s: 3, visual_in_s: 1.5}
  structure: {groups: false, scenes: false}
  dialogue_style: narration
  default_platforms: [tiktok, fb-reels, yt-shorts, yt-long]
