# Schema cài đặt (spec §5.4) — dữ liệu, mở rộng được: thêm khoá ở đây là resolver, settings.schema/explain và UI có.
#
# Mỗi khoá: type (str | int | float | bool | enum | json), default, description (tiếng Việt), tuỳ chọn choices
# (bắt buộc với enum), secret (true → giá trị bị che khi trả ra). Khoá bắt đầu bằng "_" dành cho dữ liệu nội bộ của
# global_settings, không được khai báo ở đây.
# Tầng ghi đè: default → global → preset → project → sequence → scene → clip → run (tầng sau thắng).

image.connection:
  type: str
  default: maivideo
  description: Kết nối provider dùng để tạo ảnh.
image.model:
  type: str
  default: gpt-image-2.0
  description: Model tạo ảnh.
image.resolution:
  type: enum
  default: 1440p
  choices: [1080p, 1440p, 2160p]
  description: Độ phân giải ảnh tạo ra.
image.aspect:
  type: enum
  default: "9:16"
  choices: ["9:16", "16:9", "1:1", "4:5", "3:4"]
  description: Tỉ lệ khung hình ảnh.

video.connection:
  type: str
  default: groktele
  description: Kết nối provider dùng để tạo video.
video.engine:
  type: enum
  default: ai_video
  choices: [ai_video, still_motion]
  description: Cách dựng clip — video AI hay ảnh tĩnh có chuyển động.
video.duration:
  type: enum
  default: 6
  choices: [6, 10, 15]
  description: Thời lượng mỗi clip video (giây).
video.resolution:
  type: enum
  default: 720p
  choices: [480p, 720p, 1080p]
  description: Độ phân giải video tạo ra.

tts.connection:
  type: str
  default: edge-tts
  description: Kết nối provider đọc lời thoại (TTS).
tts.voice:
  type: str
  default: vi-VN-HoaiMyNeural
  description: Giọng đọc TTS.

prompt.mode:
  type: enum
  default: synced
  choices: [verbatim, synced]
  description: Gửi prompt nguyên văn (verbatim) hay đồng bộ theo nhân vật/bối cảnh (synced).

budget.enabled:
  type: bool
  default: true
  description: Bật giới hạn ngân sách tạo ảnh/video.
budget.images_total:
  type: int
  default: 60
  description: Số ảnh tối đa được tạo trong ngân sách; 0 = không giới hạn. Kết nối giả (fake_*) không tính.
budget.videos_total:
  type: int
  default: 20
  description: Số video tối đa được tạo trong ngân sách; 0 = không giới hạn (vd. video GrokTele). Kết nối giả (fake_*) không tính.

jobs.ffmpeg_concurrency:
  type: int
  default: 2
  description: (Cũ, không còn dùng) Thay bằng concurrency.render — Cài đặt › Luồng › Dựng phim.

remote.public_hosts:
  type: json
  default: []
  description: Danh sách host công khai được phép truy cập từ xa.
remote.require_login_local:
  type: bool
  default: true
  description: >-
    Bắt đăng nhập cả khi truy cập từ máy cục bộ (mặc định bật: reverse proxy kiểu nginx `proxy_pass` không gắn header
    chuyển tiếp trông giống hệt máy cục bộ). Chỉ có hiệu lực khi đã đặt mật khẩu chủ sở hữu.
remote.allow_viewer:
  type: bool
  default: false
  description: Cho phép tài khoản chỉ xem truy cập từ xa.
remote.client_ip_header:
  type: str
  default: cf-connecting-ip
  description: >-
    Header (do tunnel/proxy ghi đè) chứa IP thật của client, dùng để giới hạn đăng nhập sai theo IP. Để trống = chỉ
    dùng IP kết nối.

# --- task a ---
prompt.negative_default:
  type: str
  default: "text, subtitles, watermark, extra people, deformed hands, morphing, scene cut"
  description: Danh sách cần tránh mặc định cho prompt synced khi project chưa có negative_block.
prompt.max_refs_image:
  type: int
  default: 9
  description: Số ảnh tham chiếu tối đa khi kết nối ảnh không khai báo max_refs.
library.look_max_refs:
  type: int
  default: 6
  description: Cảnh báo khi một look có nhiều hơn số ảnh tham chiếu này (mỏ neo + sheet + ảnh thêm).
library.drift_threshold:
  type: int
  default: 70
  description: Điểm drift check (0–100) dưới ngưỡng này thì clip bị gắn cờ drift.
# --- task d ---
audio.duration_sync:
  type: enum
  default: voice_drives
  choices: [voice_drives, clip_drives, none]
  description: >-
    Khớp thời lượng giọng ↔ clip. voice_drives — giọng quyết định độ dài clip (ai_video chọn 6/10/15 ≥ giọng);
    clip_drives — tăng tốc giọng bằng atempo ≤ 1.25 (cảnh báo nếu cần hơn); none — không tự khớp.
audio.dialogue_lufs:
  type: float
  default: -16.0
  description: Độ to mỗi câu thoại sau chuẩn hoá (LUFS, loudnorm hai lượt linear, TP −1.5).
audio.target_lufs:
  type: float
  default: -14.0
  description: Độ to tổng của bản trộn cuối (LUFS, TP −1); preset nền tảng có thể ghi đè.
subtitle.style:
  type: str
  default: 9x16
  description: Preset phụ đề (subtitle_style) — 9x16, 9x16_box, 16x9 hoặc preset tự tạo.
subtitle.mode:
  type: enum
  default: outline
  choices: [outline, karaoke_fill, word_pop]
  description: Kiểu hiện phụ đề — chữ viền, karaoke tô từ đã đọc, hoặc phóng từ đang đọc.

# --- task j ---
story.context_budget_tokens:
  type: int
  default: 12000
  description: Ngân sách token (ước 4 ký tự/token) cho toàn bộ biến gửi LLM khi viết một tập (bible + tóm tắt + mục liên quan).
story.novel_chars_per_second:
  type: int
  default: 40
  description: Chuyển thể truyện — số ký tự truyện gốc ứng với 1 giây phim (độ dài đoạn mỗi tập = giây mục tiêu × số này).
pipeline.poll_s:
  type: float
  default: 2.0
  description: Chu kỳ (giây) job quy trình kiểm tra các job con (tạo ảnh/video, dựng, xuất).
author.write_bible:
  type: enum
  default: llm
  choices: [manual, llm, agent]
  description: Ai viết Story Bible — người dùng (manual), LLM của app (llm), hay agent ngoài qua MCP (agent).
author.outline:
  type: enum
  default: llm
  choices: [manual, llm, agent]
  description: Ai lập dàn ý tập (manual / llm / agent).
author.write_script:
  type: enum
  default: llm
  choices: [manual, llm, agent]
  description: Ai viết kịch bản tập (manual / llm / agent).
author.split_clips:
  type: enum
  default: llm
  choices: [manual, llm, agent]
  description: Ai chia kịch bản thành clip (manual / llm / agent).
author.image_prompts:
  type: enum
  default: llm
  choices: [manual, llm, agent]
  description: Ai viết prompt ảnh của clip (manual / llm / agent).
author.motion_prompts:
  type: enum
  default: llm
  choices: [manual, llm, agent]
  description: Ai viết prompt chuyển động của clip (manual / llm / agent).
author.dialogue:
  type: enum
  default: llm
  choices: [manual, llm, agent]
  description: Ai viết lời thoại của clip (manual / llm / agent).
# --- task s (render, Task E) ---
render.cache_max_gb:
  type: float
  default: 30
  description: Trần dung lượng cache dựng phim (GB); vượt thì xoá segment/khối ít dùng nhất (LRU).
render.min_free_gb:
  type: float
  default: 10
  description: Dung lượng ổ trống tối thiểu (GB) giữ lại khi dựng; thiếu thì dọn cache trước.
render.chunk_target_s:
  type: int
  default: 60
  description: Độ dài mục tiêu của một khối dựng tăng dần (giây), cắt ở ranh giới clip.
render.scene_max_s:
  type: int
  default: 180
  description: Cảnh dài hơn số giây này được tách thành nhiều khối dựng.

# --- task bf ---
budget.confirm_below_units:
  type: int
  default: 5
  description: Không hỏi xác nhận lại với thao tác tốn tiền dưới số lượt (ảnh + video) này; 0 = luôn hỏi.
storage.trash_keep_days:
  type: int
  default: 30
  description: Gợi ý giữ file trong thùng rác (data/trash) bao nhiêu ngày trước khi dọn hẳn (trash.purge_preview older_than_days).
render.cache_auto_prune:
  type: bool
  default: true
  description: Tự dọn cache dựng phim (LRU theo render.cache_max_gb / render.min_free_gb) sau mỗi lần dựng và khi gọi media.cleanup.

# --- task cc (luồng theo loại provider) ---
concurrency.image:
  type: int
  default: 2
  description: Trần số việc tạo ảnh chạy cùng lúc trên toàn app (cộng mọi kết nối ảnh), 1–20. Đổi là áp dụng ngay cho việc mới.
concurrency.video:
  type: int
  default: 2
  description: Trần số việc tạo video chạy cùng lúc trên toàn app (cộng mọi kết nối video), 1–20. Đổi là áp dụng ngay cho việc mới.
concurrency.llm:
  type: int
  default: 3
  description: Trần số việc LLM chạy cùng lúc trên toàn app (kết nối LLM + việc viết truyện/dịch lồng tiếng), 1–20.
concurrency.tts:
  type: int
  default: 2
  description: Trần số việc đọc giọng (TTS) chạy cùng lúc trên toàn app, 1–20.
concurrency.stt:
  type: int
  default: 1
  description: Trần số việc nhận dạng giọng (STT) chạy cùng lúc trên toàn app, 1–20.
concurrency.render:
  type: int
  default: 1
  description: Trần số việc dựng phim/ffmpeg (lane ffmpeg) chạy cùng lúc trên toàn app, 1–20.
