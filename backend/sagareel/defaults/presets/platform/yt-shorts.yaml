# Preset nền tảng: YouTube Shorts. Ngày tra: 2026-11-19.
# Nguồn: docs/research/platform-specs.md §3 (+ §4 cho mã hoá/metadata dùng chung với long-form).
#   - https://support.google.com/youtube/answer/15424877 (dọc/vuông <= 3 phút thành Shorts; từ 15/10/2024; chính thức)
#   - https://support.google.com/youtube/answer/1722171 (mã hoá; chính thức)
#   - https://developers.google.com/youtube/v3/docs/videos (title <= 100 ký tự, description <= 5000 bytes, tags <= 500; chính thức)
#   - https://support.google.com/youtube/answer/6390658 (hashtag: > 60 bị bỏ qua, tối đa 3 hiện cạnh tiêu đề; chính thức)
#   - https://support.google.com/youtube/answer/72431 (thumbnail; chính thức)
key: yt-shorts
name: YouTube Shorts
data:
  label: YouTube Shorts (9:16)
  aspect: "9:16"
  width: 1080          # unverified (memory): 1080x1920
  height: 1920
  min_width: 540
  min_height: 960
  fps: 30
  fps_range: [24, 60]
  encode:
    container: mp4
    video_codec: libx264        # H.264 High, 2 B-frame, closed GOP, 4:2:0, BT.709, moov ở đầu (chính thức)
    profile: high
    pix_fmt: yuv420p
    preset: slow
    crf: 18                     # post-production.md §5.3 (cap ~10 Mbps; YouTube nêu Shorts ~8 Mbps)
    maxrate_kbps: 10000
    bufsize_kbps: 20000
    gop_s: 2                    # post-production.md §5.3 cho Shorts
    bframes: 2
    audio_codec: aac            # AAC-LC 48 kHz; YouTube khuyến nghị stereo 384 kbps, post-production.md dùng 192
    audio_bitrate_kbps: 192
    sample_rate: 48000
    channels: 2
    colorspace: bt709
    faststart: true
  loudness: {target_lufs: -14, true_peak_db: -1.0, tolerance_lu: 1.5}   # unverified: YouTube không công bố
  max_size_mb: 262144            # 256 GB (chính thức)
  duration_s: {min: 1, max: 180, recommended: [15, 60]}   # <= 3 phút (chính thức); recommended unverified
  safe_zone_px: {top: 269, bottom: 672, left: 65, right: 130}   # unverified: ước lượng (Meta + lề phải cho nút)
  safe_zone_ref: {width: 1080, height: 1920}
  title: {max_chars: 100, max_bytes: null}        # chính thức; không chứa < >
  caption: {max_chars: null, max_bytes: 5000}     # description <= 5000 bytes UTF-8 (chính thức)
  hashtags: {max: 60, max_shown: 3}
  tags: {max_chars: 500}
  cover: {supported: true, method: upload, width: 1080, height: 1920, format: jpg, max_mb: 2}   # 2 MB unverified; API <= 50 MB
  chapters: {supported: false}
  subtitles: {upload: true, formats: [srt, vtt]}  # chính thức
  ai_label: {required: true, mechanism: "Studio AI use / API status.containsSyntheticMedia"}   # chính thức
  checked_at: "2026-11-19"
  sources:
    - {url: "https://support.google.com/youtube/answer/15424877", official: true}
    - {url: "https://support.google.com/youtube/answer/1722171", official: true}
    - {url: "https://developers.google.com/youtube/v3/docs/videos", official: true}
    - {url: "https://support.google.com/youtube/answer/6390658", official: true}
    - {url: "https://support.google.com/youtube/answer/72431", official: true}
  unverified: [width, height, loudness, duration_s.recommended, safe_zone_px, cover.max_mb]
