[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagareel-mcp"
version = "0.1.0"
description = "MCP server mỏng của SagaReel Studio (gọi app đang chạy qua HTTP)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
sagareel-mcp = "sagareel_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["sagareel_mcp*"]

# Chạy test TỪ thư mục mcp_server/ bằng .venv-mcp (cấu hình riêng, không dùng pytest config ở gốc repo):
#   cd mcp_server; ..\.venv-mcp\Scripts\python -m pytest -q
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
